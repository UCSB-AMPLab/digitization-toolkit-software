events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        # Any name: captua.local, digitool.local on a renamed unit, the
        # unit's IP, localhost in the kiosk. The frontend calls the API on
        # the page's own origin, so every one of them works.
        server_name _;

        # ── API — strip /api prefix, proxy to native backend on the host ──
        # http://captua.local/api/cameras  →  http://host.docker.internal:8000/cameras
        location /api/ {
            # Live-preview polling hits this endpoint once per frame per camera
            # every 2s — silence access logging to keep SD-card log volume sane.
            access_log off;

            proxy_pass http://host.docker.internal:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # FastAPI auto-redirects /foo → /foo/ using the Host header, producing
            # e.g. Location: http://captua.local/collections/
            # That would fall through to the frontend (404).  Rewrite it so the
            # path is prefixed with /api/ again before the browser follows it.
            proxy_redirect ~^https?://[^/]+(/.*)$ http://$host/api$1;

            # Disable buffering so live-preview images stream through promptly
            proxy_buffering    off;
            proxy_read_timeout 120s;

            # Allow large uploads (captured documents / RAW files).
            # Keep in lockstep with the app-level cap (MAX_UPLOAD_BYTES /
            # DTK_MAX_UPLOAD_BYTES, backend app/core/config.py): nginx rejects
            # oversized bodies before Starlette spools them to a temp file, so
            # this is the effective guard; the in-app check is defense in depth
            # for setups without nginx (dev). (NEH-177)
            client_max_body_size 100m;

            # The URLs the frontend builds with the session token in the query
            # string (`<img src>` and the export download cannot send an
            # Authorization header; NEH-61). access_log is already off above,
            # but the error log still prints the request line in full, token
            # included, whenever the backend is down or slow, and `docker logs`
            # shows it on the unit. nginx cannot redact that line, so these
            # paths log only crit. Every other API path keeps error-level
            # logging. Keep the pattern in step with the `?token=` builders in
            # frontend/src/lib/api.ts.
            location ~ ^/api/(records/images/[^/]+/(thumbnail|file|preview)|collections/[^/]+/export/download)$ {
                error_log /var/log/nginx/error.log crit;
                # A regex location cannot give proxy_pass a URI, so the /api
                # prefix is stripped here; the query string is passed on as is.
                rewrite ^/api(/.*)$ $1 break;
                proxy_pass http://host.docker.internal:8000;
            }
        }

        # ── Frontend — all other traffic goes to the SvelteKit Node server ──
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket support (used by Vite HMR in dev mode)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
