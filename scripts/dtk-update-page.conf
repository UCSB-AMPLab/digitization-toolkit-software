# Installed by scripts/install-system-helper.sh as
# /etc/systemd/system/dtk.service.d/update-page.conf. Before every start of
# dtk, whoever starts it and whichever start.sh it runs, the update page is
# stopped so that nginx can bind port 80. "+": run as root, although the unit
# runs as pi. "-": a failure never fails the start. A start skipped by the
# unresolved-deployment condition runs nothing, so the failed page stays up.
[Service]
ExecStartPre=+-/usr/local/bin/dtk-system-helper update-page-stop
