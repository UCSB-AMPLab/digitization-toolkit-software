services:
  db:
    volumes:
      # Persist DB under /var/lib/dtk on the Pi
      - /var/lib/dtk/db/postgres:/var/lib/postgresql/data

  backend:
    volumes:
      # Override portable folders with appliance paths
      - /var/lib/dtk:/var/lib/dtk
      - /var/log/dtk:/var/log/dtk

  frontend:
    environment:
      # Browser-side API calls go to /api on whatever origin the page was
      # opened from (captua.local, digitool.local on a renamed unit, the
      # unit's IP, localhost in the kiosk); Nginx strips /api and proxies to
      # host.docker.internal:8000. Relative, so page and API always share an
      # origin: no CORS, and nothing for Chrome's Private Network Access
      # policy to block. Server-side rendering keeps the absolute
      # PUBLIC_API_BASE_SSR from docker-compose.yml, since Node has no page
      # origin to resolve /api against.
      - PUBLIC_API_BASE=/api
      # SvelteKit compares ORIGIN with the Origin header of form submissions
      # it receives itself (its CSRF check) and builds server-side URLs from
      # it. The app has no form actions or server endpoints, and every API
      # call goes to nginx's /api, never to SvelteKit, so a page opened by
      # another name or by IP is not refused.
      - ORIGIN=http://${HOST_IP:-localhost}

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  # Puts frontend (:3000) and backend (:8000) behind a single origin (port 80).
  # This eliminates the cross-port request that Chrome's Private Network Access
  # (PNA) policy blocks when the client is on a .local HTTP address.
  # Access the app at http://captua.local, or by the unit's IP; the kiosk
  # opens http://localhost.
  nginx:
    # Pinned by multi-arch index digest for golden-card reproducibility;
    # refresh deliberately with `docker buildx imagetools inspect <image:tag>` when updating.
    image: nginx:1.25-alpine@sha256:516475cc129da42866742567714ddc681e5eed7b9ee0b9e9c015e464b4221a00
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Pin the appliance's compose network to a fixed subnet so the host firewall
# (scripts/setup-firewall.sh) can allow container→native-backend traffic on
# port 8000 from exactly this range, instead of the whole 172.16.0.0/12 pool
# (which a venue LAN could legitimately occupy). Changing this subnet requires
# updating the firewall rule in the same commit.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
