project:
  type: website
  output-dir: ../docs/site/
  render:
    - "*.qmd"
    - "*.ipynb"

date: last-modified

website:
  title: "Digitization Toolkit Documentation"
  navbar:
    tools:
      - icon: github
        menu:
          - text: "Source Code"
            url: https://github.com/UCSB-AMPLab/digitization-toolkit-software
            target: _blank
  sidebar:
    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Home
      - section: "User Guides"
        contents:
          - href: users/external-storage.qmd
            text: "External Storage"
          - href: users/operator-card-rionegro.qmd
            text: "Tarjeta de operación (Rionegro)"
          - section: "Cameras Setup"
            contents:
              - href: users/setting-up-gphoto2-cams.qmd
      - section: "Developer Guides"
        contents:
          - section: "Hardware Setup Guides"
            contents:
              - href: developers/device_setup_CM4.qmd
                text: "Device Setup: Raspberry Pi CM4 with Cameras"
              - href: developers/device_setup_pi5_imx519.qmd
                text: "Device Setup: Raspberry Pi 5 with IMX519 Camera"
          - section: "Software Setup Guides"
            contents:
              - href: developers/sd_card_distribution.qmd
                text: "SD Card Distribution"
  page-footer:
    center: "Documentation site built: {{< meta date >}}"

format:
  html:
    css: _static/css/project.scss
    theme: cosmo
    toc: true
