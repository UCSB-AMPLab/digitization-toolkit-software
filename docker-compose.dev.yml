# Development overrides for Digitization Toolkit
# Replaces the production frontend with a Vite dev server (live reload).
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml [--profile with-backend] up
# Or via the helper script: ./scripts/start-dev.sh

services:
  backend:
    # Run migrations automatically on every dev startup so a fresh DB volume
    # always has the correct schema. Production runs migrations manually via
    # `pixi run db-upgrade` before starting the native backend.
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_FUND=false
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # npm install runs on every start so package changes are picked up automatically.
    # This is intentional for development — it requires internet access.
    # The production image (frontend/Dockerfile) pre-builds everything and needs no npm at runtime.
    command: >
      sh -c "
        npm install &&
        npm run dev -- --host 0.0.0.0
      "

volumes:
  frontend_node_modules:
