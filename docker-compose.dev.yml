# Development overrides for Digitization Toolkit
# Replaces the production frontend with a Vite dev server (live reload).
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml [--profile with-backend] up
# Or via the helper script: ./scripts/start-dev.sh

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      # Disabled: demo mode is broken (missing `demoUsers` map in login/+page.svelte,
      # causes "ReferenceError: demoUsers is not defined"). Use a real registered
      # account via --profile with-backend until the demo map is implemented.
      - PUBLIC_DEMO_MODE=false
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_FUND=false
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "
        npm install &&
        npx svelte-kit sync &&
        npm run dev -- --host 0.0.0.0
      "

volumes:
  frontend_node_modules: