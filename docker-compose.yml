services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DATABASE_USER:-user}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-password}
      - POSTGRES_DB=${DATABASE_NAME:-digitization_toolkit}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-user} -d ${DATABASE_NAME:-digitization_toolkit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER:-user}:${DATABASE_PASSWORD:-password}@db:${DATABASE_PORT:-5432}/${DATABASE_NAME:-digitization_toolkit}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python -m pip install -q -r requirements.txt &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env
    ports:
      - "5173:5173"
    environment:
      # IMPORTANT: keep localhost here so the browser can reach the API
      - PUBLIC_API_BASE=http://localhost:8000
      - NPM_CONFIG_OPTIONAL=true
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_FUND=false
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_npm_cache:/root/.npm
    command: >
      sh -lc "
        (npm ci || (rm -rf node_modules && npm install)) &&
        npm run dev -- --host 0.0.0.0
      "

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_npm_cache:
