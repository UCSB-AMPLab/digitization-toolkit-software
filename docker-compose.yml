services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DATABASE_USER:-user}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-password}
      - POSTGRES_DB=${DATABASE_NAME:-digitization_toolkit}
    ports:
      - "5432:5432"
    command: >
       postgres
       -c listen_addresses='0.0.0.0'
       -c shared_buffers=64MB
       -c work_mem=4MB
       -c wal_level=replica
       -c synchronous_commit=off
       -c full_page_writes=off
       -c max_wal_size=128MB
       -c min_wal_size=32MB
       -c wal_compression=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-user} -d ${DATABASE_NAME:-digitization_toolkit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend service (optional for Docker-based development)
  # On Raspberry Pi with cameras, run backend natively: ./scripts/run_backend_native.sh
  # For development without camera hardware, use: docker compose --profile with-backend up
  backend:
    profiles: ["with-backend"]  # Optional: only start with --profile with-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/requirements.txt:/app/requirements.txt
      # Portable host folders, just for development
      - ./_data:/var/lib/dtk
      - ./_logs:/var/log/dtk
    environment:
      - DATABASE_HOST=db
      - DATABASE_USER=${DATABASE_USER:-user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-password}
      - DATABASE_NAME=${DATABASE_NAME:-digitization_toolkit}
      - DATABASE_PORT=5432
      - DTK_DATA_DIR=/var/lib/dtk
      - DTK_LOG_DIR=/var/log/dtk
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env
    ports:
      - "5173:5173"
    environment:
      # IMPORTANT: keep localhost here so the browser can reach the API
      - PUBLIC_API_BASE=http://localhost:8000
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_FUND=false
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: >
      sh -c "
        npm install --include=optional &&
        npm run dev -- --host 0.0.0.0
      "

volumes:
  postgres_data:
  frontend_npm_cache:
